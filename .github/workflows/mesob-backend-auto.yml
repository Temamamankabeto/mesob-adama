name: MESOB Backend Automatic Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesob-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, pdo_pgsql, bcmath, zip, intl, gd
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-dev --prefer-dist \
            --no-interaction --optimize-autoloader --no-scripts

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.MESOB_BACKEND_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MESOB_BACKEND_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          HOST: ${{ secrets.MESOB_BACKEND_HOST }}
          USER: ${{ secrets.MESOB_BACKEND_USER }}
        run: |
          set -euo pipefail

          ID="be_${GITHUB_SHA}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          TARGET="/var/www/mesob-backend-releases/releases/$ID"

          ssh -o BatchMode=yes "$USER@$HOST" \
            "mkdir '$TARGET'"

          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='bootstrap/cache/*.php' \
            --exclude='tests/' \
            ./ "$USER@$HOST:$TARGET/"

          ssh -o BatchMode=yes "$USER@$HOST" \
            "bash /home/eservadmin/mesob-backend-deploy.sh deploy '$ID'"
