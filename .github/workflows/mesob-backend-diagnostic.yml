name: MESOB Backend Production Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.MESOB_BACKEND_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.MESOB_BACKEND_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inspect production Laravel migrations
        env:
          HOST: ${{ secrets.MESOB_BACKEND_HOST }}
          USER: ${{ secrets.MESOB_BACKEND_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          echo "=== ACTIVE BACKEND RELEASE ==="

          LIVE="/var/www/mesob-adama/backend"

          if [ ! -L "$LIVE" ]; then
            echo "Production backend symlink is missing."
            exit 1
          fi

          APP=$(readlink -f "$LIVE")

          if [ ! -f "$APP/artisan" ]; then
            echo "Live Laravel application not found."
            exit 1
          fi

          echo "=== LIVE SYMLINK ==="
          ls -ld "$LIVE"

          echo "=== TICKET MIGRATION FILES ==="
          find "$APP/database/migrations" \
            -maxdepth 1 -name '2026_11_06*' -printf '%f\n'

          echo "Active release: $APP"

          cd "$APP"

          echo "=== DATABASE MIGRATION STATUS ==="
          php artisan migrate:status --no-ansi

          echo "=== TICKET FOREIGN KEY DEPENDENCIES ==="
          php artisan tinker --execute='
          foreach ([
              "users",
              "services",
              "windows",
              "cities",
              "subcities",
              "woredas"
          ] as $table) {
              echo $table . ": " .
                  (\Illuminate\Support\Facades\Schema::hasTable($table)
                      ? "EXISTS"
                      : "MISSING") . PHP_EOL;
          }
          '
          echo "=== TICKET TABLE EXISTENCE ==="
          php artisan tinker --execute='
          foreach ([
              "ticket_sequences",
              "tickets",
              "kiosks",
              "kiosk_primary_officers"
          ] as $table) {
              echo $table . ": " .
                  (\Illuminate\Support\Facades\Schema::hasTable($table)
                      ? "EXISTS"
                      : "MISSING") . PHP_EOL;
          }
          '

          echo "=== DEPLOYMENT SCRIPT MIGRATION REFERENCES ==="
          grep -nE 'artisan migrate|migrate --force|migrate:status' \
            /home/eservadmin/mesob-backend-deploy.sh || true

          echo "=== POSTGRESQL BACKUP READINESS ==="

          if command -v pg_dump >/dev/null 2>&1; then
            echo "PG_DUMP=AVAILABLE"
            pg_dump --version
          else
            echo "PG_DUMP=MISSING"
          fi

          if command -v pg_restore >/dev/null 2>&1; then
            echo "PG_RESTORE=AVAILABLE"
            pg_restore --version
          else
            echo "PG_RESTORE=MISSING"
          fi

          echo "=== DATABASE CONNECTION ==="

          php artisan tinker --execute='
          $db = \Illuminate\Support\Facades\DB::connection();

          echo "DRIVER=" . $db->getDriverName() . PHP_EOL;
          echo "DATABASE=" . $db->getDatabaseName() . PHP_EOL;
          '

          echo "STEP_29EN_BACKUP_READINESS=CHECKED"
          echo "STEP_29CQ_DIAGNOSTIC=COMPLETE"
          REMOTE

      - name: Inspect backend release activation
        env:
          HOST: ${{ secrets.MESOB_BACKEND_HOST }}
          USER: ${{ secrets.MESOB_BACKEND_USER }}
        run: |
          set -euo pipefail

          ssh -o BatchMode=yes "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          BASE="/var/www/mesob-backend-releases"

          echo "=== CURRENT SYMLINK ==="
          ls -ld "$BASE/current"
          readlink -f "$BASE/current"

          echo "=== LATEST RELEASE DIRECTORIES ==="
          ls -ldt "$BASE/releases"/* | head -n 8

          echo "=== DEPLOYMENT SCRIPT ==="
          sed -n '1,240p' /home/eservadmin/mesob-backend-deploy.sh

          echo "=== NEWEST RELEASE TICKET MIGRATIONS ==="
          LATEST=$(find "$BASE/releases" -mindepth 1 -maxdepth 1 \
            -type d -name 'be_*' -printf '%T@ %p\n' |
            sort -nr | head -n 1 | cut -d' ' -f2-)

          if [ -n "$LATEST" ]; then
            echo "Latest release: $LATEST"
            find "$LATEST/database/migrations" \
              -maxdepth 1 -name '2026_11_06*' -printf '%f\n'
          else
            echo "No be_* release directory found."
          fi

          echo "STEP_29DH_RELEASE_INSPECTION=COMPLETE"
          REMOTE
